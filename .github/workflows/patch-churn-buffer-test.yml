name: Patch churn buffer smoke expectations

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update smoke expectations for 5-day buffer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/full-app-smoke.test.js')
          s=p.read_text()
          replacements={
            "wc.churnBufferDays===0":"wc.churnBufferDays===5",
            "sandbox.nextReopen(eligibility)==='2027-09-10'&&sandbox.churnReadyDate(eligibility)==='2027-09-10'":"sandbox.nextReopen(eligibility)==='2027-09-15'&&sandbox.churnReadyDate(eligibility)==='2027-09-15'",
            "genericRepeat.churnBasis==='closed'&&genericRepeat.churnBufferDays===0":"genericRepeat.churnBasis==='closed'&&genericRepeat.churnBufferDays===5",
            "sandbox.nextReopen(genericRepeat)==='2028-03-05'":"sandbox.nextReopen(genericRepeat)==='2028-03-10'",
            "/1 year after confirmed account close date/":"/1 year \\+ 5-day safety buffer after confirmed account close date/"
          }
          for old,new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing expected smoke assertion: {old}')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/full-app-smoke.test.js
          if git diff --cached --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git commit -m "Update smoke tests for 5-day churn buffer"
          git push
