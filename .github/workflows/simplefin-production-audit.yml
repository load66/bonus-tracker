name: SimpleFIN Production Browser Audit

on:
  pull_request:
    paths:
      - 'tests/simplefin-prod-health.cjs'
      - 'tests/wait-deployed-simplefin.cjs'
      - 'tests/*.e2e.cjs'
      - '.github/workflows/simplefin-production-audit.yml'
  workflow_run:
    workflows: ['Verify and Deploy BonusTracker']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-audit-${{ github.event.workflow_run.head_sha || github.sha }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  publication:
    name: Verify exact published assets and authorization
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'schedule')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live web assets and private API authorization
        run: node tests/simplefin-prod-health.cjs
      - name: Poll exact deploy every 15 seconds, maximum 10 minutes
        if: github.event_name != 'pull_request'
        run: node tests/wait-deployed-simplefin.cjs

  safari:
    name: Production WebKit first
    if: github.event_name != 'pull_request'
    needs: publication
    uses: ./.github/workflows/verified-product-browser.yml
    with:
      browser: webkit
      site_url: https://load66.github.io/bonus-tracker/
      source_ref: ${{ github.event.workflow_run.head_sha || github.sha }}

  remaining-browsers:
    name: Production / ${{ matrix.browser }}
    if: github.event_name != 'pull_request'
    needs: safari
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    uses: ./.github/workflows/verified-product-browser.yml
    with:
      browser: ${{ matrix.browser }}
      site_url: https://load66.github.io/bonus-tracker/
      source_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
