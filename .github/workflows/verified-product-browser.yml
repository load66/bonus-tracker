name: Verified Product Link Browser Matrix

on:
  workflow_call:
    inputs:
      browser:
        required: true
        type: string
      source_ref:
        required: false
        type: string
        default: ''
      site_url:
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  browser:
    name: Browser ${{ inputs.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Match browser home ownership to the container user
        run: node -e "require('node:fs').chownSync(require('node:os').homedir(), process.getuid(), process.getgid())"
      - name: Cache pinned Playwright API
        id: api-cache
        uses: actions/cache@v4
        with:
          path: /tmp/bonus-browser/node_modules
          key: playwright-test-api-linux-1.58.2
      - name: Install API only, reuse container browser binaries
        if: steps.api-cache.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix /tmp/bonus-browser --no-save @playwright/test@1.58.2
      - name: Verify existing browser workflows with per-test retry and timeout
        env:
          NODE_PATH: /tmp/bonus-browser/node_modules
          BT_BROWSER: ${{ inputs.browser }}
          BT_BROWSER_SITE_URL: ${{ inputs.site_url }}
          BT_BROWSER_RESULTS: /tmp/bonus-browser-results/test-results
        run: /tmp/bonus-browser/node_modules/.bin/playwright test --config tests/playwright.config.cjs
      - name: Preserve every browser result and retry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ inputs.browser }}-${{ github.run_attempt }}
          path: /tmp/bonus-browser-results
          if-no-files-found: error
