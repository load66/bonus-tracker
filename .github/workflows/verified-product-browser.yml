name: Verified Product Link Browser Matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'bank-sync.js'
      - 'bonus-evidence-core.js'
      - 'bonus-requirements-progress.js'
      - 'finance-page.js'
      - 'tests/bank-sync.e2e.cjs'
      - 'tests/bonus-evidence.e2e.cjs'
      - 'tests/finance-page.e2e.cjs'
      - 'tests/browser-e2e.cjs'
      - 'tests/bonus-requirements-progress.test.js'
      - '.github/workflows/verified-product-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-product-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    steps:
      - name: Checkout verified product link changes
        uses: actions/checkout@v4

      - name: Install matching browser test API without changing browser binaries
        run: npm install --prefix /tmp/verified-product-browser --no-save playwright@1.58.2

      - name: Run product mapping and read-only bonus evidence unit checks
        run: |
          node tests/bonus-evidence.test.js
          node tests/bonus-requirements-progress.test.js
          node --check bank-sync.js
          node --check bonus-requirements-progress.js

      - name: Validate actual Chromium Firefox WebKit product link workflows
        env:
          HOME: /root
          NODE_PATH: /tmp/verified-product-browser/node_modules
          BT_BROWSER_RESULTS: /tmp/product-browser-results
        run: |
          node tests/bonus-evidence.e2e.cjs
          node tests/finance-page.e2e.cjs
          node tests/bank-sync.e2e.cjs
          node tests/browser-e2e.cjs

      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-product-link-browser-evidence
          path: /tmp/product-browser-results
          if-no-files-found: ignore
