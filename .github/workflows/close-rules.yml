name: Verify and Deploy BonusTracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  # Isolate production deployments from PR test queues; GitHub keeps only one pending run per group.
  group: bonus-tracker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify latest release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify latest release files
        run: python3 tests/verify-latest.py

      - name: Check every JavaScript file
        run: find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Run close-rule tests
        run: node tests/close-rules.test.js

      - name: Run full app smoke and analyzer tests
        run: node tests/full-app-smoke.test.js

      - name: Run structured financial-rule and import tests
        run: node tests/financial-rules.test.js && node tests/structured-import.test.js

      - name: Run Ask AI grounding and closure guidance tests
        run: node tests/bonus-ai.test.js && node tests/bonus-ai-auth.test.js

      - name: Run entry-file import and replacement safety tests
        run: node tests/entry-file-import.test.js

      - name: Run transactional persistence and restore tests
        run: node tests/persistence-transaction.test.js && node tests/cloud-recovery.test.js && node tests/cloud-protection.test.js

      - name: Run canonical semantic status tests
        run: node tests/semantic-status.test.js

      - name: Run imported fee-review migration tests
        run: node tests/fee-review-migration.test.js

      - name: Run smart Needs Attention coverage tests
        run: node tests/smart-attention.test.js

      - name: Run professional operations UI tests
        run: node tests/professional-ops.test.js

      - name: Run integrated account lifecycle and restore tests
        env:
          TZ: America/Chicago
        run: node tests/end-to-end.test.js

      - name: Run operations interaction tests
        run: node tests/operations-interactions.test.js

      - name: Run next-action consistency and data preservation tests
        run: node tests/next-actions.test.js && node tests/specific-actions.test.js && node tests/research-tabs.test.js

      - name: Run churn eligibility evidence tests
        run: node tests/eligibility-gate.test.js

      - name: Run universal 2-day churn buffer tests
        run: node tests/churn-buffer.test.js && node tests/countdown-options.test.js

      - name: Run hardening regression tests
        env:
          TZ: America/Chicago
        run: node tests/hardening-regression.test.js

      - name: Verify bank-only feed filtering
        run: python3 -B tests/bank-feed.test.py && node tests/bank-feed.test.js

      - name: Refresh bank bonus RSS metadata
        if: github.event_name != 'pull_request'
        run: python3 scripts/update-bank-feed.py

      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/bonus-tracker-browser-tests" --no-save playwright@1.58.2
          "$RUNNER_TEMP/bonus-tracker-browser-tests/node_modules/.bin/playwright" install --with-deps chromium firefox webkit

      - name: Check financial observation arithmetic and data scope
        run: node tests/finance-session.test.js && node tests/finance-overview.test.js

      - name: Verify bank bonus evidence inbox and promotion-scoped candidate progress
        run: node tests/bonus-evidence.test.js && node tests/bonus-requirements-progress.test.js

      - name: Run real browser end-to-end tests
        env:
          NODE_PATH: ${{ runner.temp }}/bonus-tracker-browser-tests/node_modules
          BT_BROWSER_RESULTS: ${{ runner.temp }}/bonus-tracker-browser-results
        run: node tests/bonus-evidence.e2e.cjs && node tests/finance-page.e2e.cjs && node tests/bank-sync.e2e.cjs && node tests/browser-e2e.cjs

      - name: Save browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bonus-tracker-browser-results
          if-no-files-found: ignore

      - name: Package the exact verified site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

  deploy:
    name: Deploy verified release to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
