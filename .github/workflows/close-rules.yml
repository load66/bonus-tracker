name: Verify and Deploy BonusTracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Scheduled verification has a separate queue and cannot replace a release.
  group: bonus-tracker-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'schedule' && 'scheduled' || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select verification scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      areas: ${{ steps.scope.outputs.areas }}
      browsers: ${{ steps.scope.outputs.browsers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify latest release files
        run: python3 tests/verify-latest.py
      - name: Check every JavaScript file
        run: find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
      - name: Select remaining full verification coverage
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            const {plan}=require('./tests/ci-scope.cjs');
            let files=[],complete=true;
            if(context.eventName==='pull_request'){
              const rows=await github.paginate(github.rest.pulls.listFiles,{...context.repo,pull_number:context.issue.number,per_page:100});
              files=rows.map(row=>row.filename);
              complete=files.length===context.payload.pull_request.changed_files;
            }
            const selected=plan(context.eventName,files,complete);
            core.setOutput('areas',JSON.stringify(selected.areas));
            core.setOutput('browsers',JSON.stringify(selected.browsers));
            core.summary.addRaw('Verification scope: Full; browsers: '+selected.browsers.join(', ')).write();

  units:
    name: Unit tests / ${{ matrix.area }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        area: ${{ fromJSON(needs.plan.outputs.areas) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run every suite in this area with a per-suite timeout
        run: node tests/ci-units.cjs ${{ matrix.area }}
        env:
          TZ: America/Chicago

  browsers:
    name: Browser checks / Chromium
    needs: [plan, units]
    uses: ./.github/workflows/verified-product-browser.yml

  verify:
    name: Verify latest release
    needs: [plan, units, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
      - name: Refresh bank bonus RSS metadata
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/update-bank-feed.py
      - name: Package the exact verified site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

  deploy:
    name: Deploy verified release to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
