name: Refresh bank bonus offers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-bank-feed.py'
      - '.github/workflows/refresh-bank-feed.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bonus-tracker-offer-feed-publisher
  cancel-in-progress: false

jobs:
  update-offers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh and consolidate public bank RSS offers
        run: python3 scripts/update-bank-feed.py
      - name: Validate generated feed against synthetic regression suite
        run: python3 -B tests/bank-feed.test.py
      - name: Commit updated published data
        id: write
        run: |
          if git diff --quiet -- data/bank-bonuses.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bank-bonuses.json
          git commit -m "data: refresh canonical bank bonus offers"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish verified snapshot
        if: steps.write.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run close-rules.yml --ref main
