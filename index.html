<script>
(function(){
  if(!('serviceWorker' in navigator))return;
  let refreshed=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshed)return;
    refreshed=true;
    location.reload();
  });
  navigator.serviceWorker.register('./sw.js?v=3.4.14-attention1',{updateViaCache:'none'}).then(reg=>{
    const activate=worker=>{try{worker&&worker.postMessage({type:'SKIP_WAITING'})}catch{}};
    if(reg.waiting)activate(reg.waiting);
    reg.addEventListener('updatefound',()=>{
      const worker=reg.installing;
      if(!worker)return;
      worker.addEventListener('statechange',()=>{
        if(worker.state==='installed')activate(worker);
      });
    });
    reg.update().catch(()=>{});
  }).catch(()=>{});
})();
</script>
